name: course-management-lab1

services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_management}
      POSTGRES_USER: ${POSTGRES_USER:-course_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-course_management}
      DB_USERNAME: ${POSTGRES_USER:-course_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      APP_PORT: 8080
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
volumes:
  postgres_data:
