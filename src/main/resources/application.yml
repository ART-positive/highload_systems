spring:
  application:
    name: course-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_management}
    username: ${DB_USERNAME:course_app}
    password: ${DB_PASSWORD:local_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${APP_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    version: OPENAPI_3_0
